# OAuth2 (secret: application-oauth.local.properties — gitignore)
spring.config.import=optional:classpath:application-oauth.local.properties
# Sau OAuth, BE redirect FE về URL này (vite preview thường 4173; dev `npm run dev` theo PORT trong .env)
