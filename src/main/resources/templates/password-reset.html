<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Đặt lại mật khẩu</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #0f172a;">
<p>Xin chào <strong th:text="${name}">User</strong>,</p>
<p>Bạn (hoặc ai đó) đã yêu cầu đặt lại mật khẩu Job Hunter.</p>
<p>
    <a th:href="${resetLink}"
       style="display:inline-block;padding:12px 20px;background:#2563eb;color:#fff;text-decoration:none;border-radius:8px;">
        Đặt lại mật khẩu
    </a>
</p>
<p>Link có hiệu lực <span th:text="${validMinutes}">30</span> phút. Nếu bạn không yêu cầu, hãy bỏ qua email này.</p>
<p style="font-size:12px;color:#64748b;" th:text="${resetLink}"></p>
</body>
</html>
